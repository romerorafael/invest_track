name: invest_track
description: A Flutter app for tracking investments, with favorites and notifications.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Gerenciamento de estado
  flutter_riverpod: ^2.4.0

  # Firebase e Google Sign-In
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  google_sign_in: ^6.3.0
  firebase_messaging: ^15.2.5
  
  # HTTP Client para APIs
  http: ^1.3.0

  # Navegação
  go_router: ^15.1.1

  # Notificações locais
  # Preferências locais (opcional para tema)
  shared_preferences: ^2.5.3
  flutter_colorpicker: ^1.1.0
  intl: ^0.20.2
  permission_handler: ^12.0.0+1
  image_picker: ^1.1.2
  firebase_storage: ^12.4.5
  firebase_app_check: ^0.3.2+5



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/